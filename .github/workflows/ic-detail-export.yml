name: Temporary IC detail build export

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ic-detail-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: '9.14.2'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/core/ic-circuit.ts src/types/globals.d.ts
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test
      - name: Export formatted sources and generated JavaScript
        shell: bash
        run: |
          node -e "const fs=require('node:fs');for(const p of ['src/core/ic-circuit.ts','src/types/globals.d.ts','assets/js/core/ic-circuit.js','assets/js/ui/board.js']){const b=fs.readFileSync(p).toString('base64');for(let i=0;i<b.length;i+=3000)console.log('ICDETAILGEN|'+p+'|'+i+'|'+b.slice(i,i+3000));}"
